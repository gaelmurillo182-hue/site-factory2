<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 96" width="332" height="96"
     fill="none" role="img" aria-label="Свод">
  <title>Свод</title>
  <!--
    Логотип = знак + слово. Пропорции жёсткие:
    высота знака = высота прописной буквы = 56 единиц;
    расстояние от знака до «С» = 28 единиц (половина знака).
    Слово нарисовано, а не набрано: файл не зависит от наличия шрифта в системе.
    Цвет — один, через currentColor.
  -->

  <!-- Знак: три клина плоского свода, швы сходятся в точке (28, 113) -->
  <g fill="currentColor">
    <polygon points="0,16 14,16 20.93,72 0,72"/>
    <polygon points="18,16 38,16 31.07,72 24.93,72"/>
    <polygon points="42,16 56,16 56,72 35.07,72"/>
  </g>

  <!-- Слово «СВОД». Геометрический гротеск, единая толщина 9, торцы прямые. -->
  <g stroke="currentColor" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- С -->
    <path d="M127.11 26 A23.5 23.5 0 1 0 127.11 62"/>
    <!-- В -->
    <path d="M156.5 16 V72"/>
    <path d="M156.5 20.5 H178.25 A11.75 11.75 0 0 1 178.25 44 H156.5"/>
    <path d="M156.5 44 H183.75 A11.75 11.75 0 0 1 183.75 67.5 H156.5"/>
    <!-- О -->
    <circle cx="240" cy="44" r="23.5"/>
    <!-- Д -->
    <path d="M289 67.5 L296.5 20.5 H322.5 V67.5"/>
    <path d="M282 67.5 H332"/>
    <path d="M286.5 67.5 V78"/>
    <path d="M327.5 67.5 V78"/>
  </g>
</svg>
