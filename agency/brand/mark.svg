<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="currentColor" role="img" aria-label="Свод">
  <title>Свод</title>
  <!--
    Знак «Свод» — плоский свод (клинчатая перемычка) из трёх камней.
    Швы не вертикальные: они расходятся из одной точки под конструкцией (32, 101).
    Поэтому камни клиновидные, поэтому перемычка держит нагрузку и не падает.
    Средний камень — замковый: вынь его, и держать нечего.

    Цвет наследуется через currentColor. Зазоры — это фон, а не белый:
    знак ставится только на плоскую заливку, никогда на фото.
    Ширина зазора 4 единицы из 64 = 1 px при отрисовке в 16 px.
  -->
  <polygon points="4,4 18,4 24.93,60 4,60"/>
  <polygon points="22,4 42,4 35.07,60 28.93,60"/>
  <polygon points="46,4 60,4 60,60 39.07,60"/>
</svg>
